name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node test/run.js

      - name: Self-scan (dogfooding, executable logic only)
        # lib/patterns.js legitimately contains the trigger keywords as pattern
        # definitions, so only bin/ (the actual executable entry point) is scanned here.
        run: node bin/depguard.js bin --fail-on high

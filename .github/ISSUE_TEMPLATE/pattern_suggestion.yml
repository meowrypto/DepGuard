name: New pattern suggestion
description: Suggest a new suspicious pattern for DepGuard to detect
title: "[Pattern] "
labels: ["pattern-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make DepGuard smarter! Please describe the technique you'd like detected.
        **Do not paste real malicious code or a link to a live attack.** A sanitized, non-functional example is enough — see `lib/patterns.js` for the format other patterns use.

  - type: textarea
    id: description
    attributes:
      label: What technique should be detected?
      description: Describe the suspicious behavior in your own words.
      placeholder: e.g. "Packages that read the Windows credential manager..."
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Sanitized example
      description: A short, non-functional code snippet showing the shape of the pattern (no real payloads, no live URLs).
      render: javascript
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options:
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Where did you see this technique?
      description: A blog post, security advisory, or your own experience. Links to write-ups are welcome; links to live malware are not.
    validations:
      required: false
